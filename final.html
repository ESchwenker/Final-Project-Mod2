<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Final Project</title>
    <link rel="stylesheet" href="final.css" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lato:wght@400;700&family=Roboto:wdth,wght@75..100,100..900&display=swap");
    </style>
  </head>
  <body>
    <section id="landing">
      <nav>
        <div class="nav__container">
          <div class="nav__logo">
            <img
              class="logo"
              src="./assets/logo.2c489fc453a1783cbadacf914efa3df6.svg"
            />
            <div class="nav__logo--title">Treact</div>
          </div>
          <div class="nav__links">
            <a href="#" class="nav__link">About</a>
            <a href="#" class="nav__link">Blog</a>
            <a href="#" class="nav__link">Pricing</a>
            <a href="#" class="nav__link">Contact Us</a>
            <a href="#" class="nav__link--login">Login</a>
            <button><a href="#" class="nav__btn">Sign Up</a></button>
          </div>
        </div>
      </nav>
      <header>
        <div class="header__container">
          <div class="header__description">
            <h1>
              Beautiful React Templates <span class="purple">for you.</span>
            </h1>
            <p class="header__description--para">
              Our templates are easy to setup, understand and customize. Fully
              modular components with a variety of pages and components.
            </p>
            <div class="header__email">
              <input
                type="text"
                class="header__email--input"
                placeholder="Your E-mail Address"
              />
              <button class="header__email--btn">Get Started</button>
            </div>
            <p class="header__customers--title">OUR TRUSTED CUSTOMERS</p>
            <img
              class="header__customers--img"
              src="./assets/customers-logo-strip.680ac7c2e8ae28161d2c.png"
            />
          </div>
          <figure class="header__img--wrapper">
            <img class="header__img" 
              src="./assets/design-illustration-2.6da6a00b20c07c4a9b65d1870679e1b8.svg"
            />
          </figure>
        </div>
      </header>
    </section>
    <main></main>
  </body>
</html>
